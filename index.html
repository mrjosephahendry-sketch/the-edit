<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Edit — Outfit Lookbook</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#211F1C">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    box-sizing: border-box;
    --bg: #EDE9E1;
    --surface: #FFFFFF;
    --surface-2: #F5F2EC;
    --ink: #211F1C;
    --ink-soft: #6B665C;
    --line: rgba(33,31,28,0.14);
    --line-strong: rgba(33,31,28,0.28);
    --own: #2F4538;
    --own-bg: rgba(47,69,56,0.10);
    --buy: #A5732C;
    --buy-bg: rgba(165,115,44,0.12);
    --pin-ring: rgba(255,255,255,0.9);
    --font-display: 'Fraunces', Georgia, serif;
    --font-body: 'Inter', -apple-system, sans-serif;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #171613;
      --surface: #211F1C;
      --surface-2: #29271F;
      --ink: #ECE7DD;
      --ink-soft: #A9A296;
      --line: rgba(236,231,221,0.14);
      --line-strong: rgba(236,231,221,0.30);
      --own: #7FA98C;
      --own-bg: rgba(127,169,140,0.14);
      --buy: #D6A85C;
      --buy-bg: rgba(214,168,92,0.14);
    }
  }
  :root[data-theme="dark"] {
    --bg: #171613;
    --surface: #211F1C;
    --surface-2: #29271F;
    --ink: #ECE7DD;
    --ink-soft: #A9A296;
    --line: rgba(236,231,221,0.14);
    --line-strong: rgba(236,231,221,0.30);
    --own: #7FA98C;
    --own-bg: rgba(127,169,140,0.14);
    --buy: #D6A85C;
    --buy-bg: rgba(214,168,92,0.14);
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-body);
    -webkit-font-smoothing: antialiased;
    min-height: 100%;
  }
  a { color: inherit; }

  .app { max-width: 900px; margin: 0 auto; padding: 28px 20px 80px; }

  header.top {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 16px;
    margin-bottom: 22px;
  }
  header.top .mark {
    font-family: var(--font-display);
    font-weight: 500;
    font-size: 26px;
    letter-spacing: 0.01em;
  }
  header.top .mark .dot { color: var(--buy); }
  header.top p.sub {
    margin: 4px 0 0;
    font-size: 13px;
    color: var(--ink-soft);
    max-width: 30ch;
  }

  nav.tabs {
    display: inline-flex;
    border: 1px solid var(--line-strong);
    border-radius: 999px;
    padding: 3px;
    gap: 2px;
    background: var(--surface);
  }
  nav.tabs button {
    border: none;
    background: transparent;
    font-family: var(--font-body);
    font-size: 13px;
    font-weight: 500;
    color: var(--ink-soft);
    padding: 7px 16px;
    border-radius: 999px;
    cursor: pointer;
  }
  nav.tabs button.active {
    background: var(--ink);
    color: var(--bg);
  }

  .filter-bar {
    display: none;
    align-items: center;
    gap: 10px;
    margin: 0 0 18px;
    padding: 10px 14px;
    background: var(--surface-2);
    border: 1px solid var(--line);
    border-radius: 4px;
    font-size: 13px;
  }
  .filter-bar.show { display: flex; }
  .filter-bar strong { font-weight: 600; }
  .filter-bar button {
    margin-left: auto;
    border: 1px solid var(--line-strong);
    background: var(--surface);
    color: var(--ink);
    font-size: 12px;
    padding: 5px 11px;
    border-radius: 999px;
    cursor: pointer;
    font-family: var(--font-body);
  }

  /* ---- Board ---- */
  .board {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    gap: 14px;
  }
  .card {
    position: relative;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 4px;
    overflow: hidden;
    cursor: pointer;
    aspect-ratio: 3/4;
  }
  .card img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .card .badge {
    position: absolute;
    top: 8px;
    right: 8px;
    background: rgba(23,22,19,0.72);
    color: #fff;
    font-size: 11px;
    padding: 2px 7px;
    border-radius: 999px;
    font-family: var(--font-body);
  }
  .card.dimmed { opacity: 0.28; }
  .card.matched { outline: 2px solid var(--buy); outline-offset: -2px; }
  .card .scenarios {
    position: absolute;
    left: 8px;
    bottom: 8px;
    right: 8px;
    display: flex;
    gap: 4px;
    flex-wrap: wrap;
  }
  .card .scenarios span {
    background: rgba(255,255,255,0.88);
    color: #211F1C;
    font-size: 10px;
    font-weight: 500;
    padding: 2px 7px;
    border-radius: 999px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 100%;
  }

  .add-card {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 6px;
    background: transparent;
    border: 1.5px dashed var(--line-strong);
    border-radius: 4px;
    aspect-ratio: 3/4;
    cursor: pointer;
    color: var(--ink-soft);
    font-family: var(--font-body);
    font-size: 12.5px;
  }
  .add-card .plus { font-family: var(--font-display); font-size: 28px; line-height: 1; color: var(--ink); }

  .empty {
    padding: 60px 20px;
    text-align: center;
    color: var(--ink-soft);
    font-size: 14px;
  }
  .empty .big { font-family: var(--font-display); font-size: 20px; color: var(--ink); margin-bottom: 6px; }

  /* ---- Wardrobe list ---- */
  .wlist { display: flex; flex-direction: column; border-top: 1px solid var(--line); }
  .witem {
    display: flex;
    flex-direction: column;
    gap: 8px;
    padding: 14px 4px;
    border-bottom: 1px solid var(--line);
  }
  .witem .row-top { display: flex; align-items: center; gap: 12px; }
  .witem .row-bottom { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding-left: 30px; }
  .witem .name-btn {
    background: none;
    border: none;
    text-align: left;
    font-family: var(--font-display);
    font-size: 16.5px;
    color: var(--ink);
    cursor: pointer;
    padding: 0;
    flex: 1;
    min-width: 0;
  }
  .witem .count {
    font-family: var(--font-body);
    font-size: 12px;
    color: var(--ink-soft);
    display: block;
    margin-top: 2px;
  }
  .status-toggle {
    display: inline-flex;
    border: 1px solid var(--line-strong);
    border-radius: 999px;
    overflow: hidden;
    flex-shrink: 0;
  }
  .status-toggle button {
    border: none;
    background: var(--surface);
    font-family: var(--font-body);
    font-size: 11.5px;
    font-weight: 500;
    padding: 6px 11px;
    cursor: pointer;
    color: var(--ink-soft);
  }
  .status-toggle button.own.on { background: var(--own-bg); color: var(--own); }
  .status-toggle button.buy.on { background: var(--buy-bg); color: var(--buy); }
  .witem .del {
    border: none;
    background: none;
    color: var(--ink-soft);
    cursor: pointer;
    font-size: 15px;
    padding: 4px 6px;
    flex-shrink: 0;
  }
  .witem .pick {
    width: 18px;
    height: 18px;
    border: 1.5px solid var(--line-strong);
    border-radius: 4px;
    flex-shrink: 0;
    cursor: pointer;
    background: var(--surface);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    color: var(--bg);
  }
  .witem .pick.on { background: var(--ink); border-color: var(--ink); }

  .season-row { display: inline-flex; gap: 4px; }
  .season-btn {
    width: 26px;
    height: 26px;
    border-radius: 50%;
    border: 1px solid var(--line-strong);
    background: var(--surface);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    line-height: 1;
    cursor: pointer;
    padding: 0;
    flex-shrink: 0;
  }
  .season-btn.on { background: var(--ink); border-color: var(--ink); }
  .season-btn.small { width: 22px; height: 22px; font-size: 11px; }

  .buy-link { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; }
  .buy-link a {
    color: var(--buy);
    text-decoration: none;
    border-bottom: 1px solid var(--buy-bg);
    max-width: 160px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .buy-link button.linkbtn {
    border: none;
    background: none;
    color: var(--ink-soft);
    text-decoration: underline;
    cursor: pointer;
    font-size: 12px;
    padding: 0;
    font-family: var(--font-body);
  }
  .buy-link input {
    border: 1px solid var(--line-strong);
    border-radius: 4px;
    padding: 5px 8px;
    font-size: 12px;
    font-family: var(--font-body);
    color: var(--ink);
    background: var(--surface);
    width: 160px;
  }

  .season-filter {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 2px 4px 16px;
    flex-wrap: wrap;
  }
  .season-filter .label { font-size: 12px; color: var(--ink-soft); margin-right: 2px; }

  .selectbar {
    position: sticky;
    bottom: env(safe-area-inset-bottom, 0px);
    display: none;
    align-items: center;
    gap: 10px;
    background: var(--ink);
    color: var(--bg);
    padding: 10px 14px;
    border-radius: 8px;
    margin-top: 12px;
    font-size: 13px;
  }
  .selectbar.show { display: flex; }
  .selectbar .mode-toggle { display: inline-flex; border: 1px solid rgba(255,255,255,0.3); border-radius: 999px; overflow: hidden; margin-left: auto; }
  .selectbar .mode-toggle button { border: none; background: none; color: var(--bg); font-size: 11.5px; padding: 5px 10px; cursor: pointer; opacity: 0.6; font-family: var(--font-body); }
  .selectbar .mode-toggle button.on { opacity: 1; background: rgba(255,255,255,0.16); }
  .selectbar button.view {
    border: none;
    background: var(--buy);
    color: #211F1C;
    font-weight: 600;
    font-size: 12.5px;
    padding: 7px 13px;
    border-radius: 999px;
    cursor: pointer;
    font-family: var(--font-body);
  }

  .scenario-editor {
    max-width: 100%;
    margin: 0 auto;
    padding: 12px 16px 0;
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    align-items: center;
  }
  .scenario-editor .chip {
    background: rgba(255,255,255,0.12);
    color: #F5F2EC;
    font-size: 12px;
    padding: 5px 10px;
    border-radius: 999px;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .scenario-editor .chip button { border: none; background: none; color: #F5F2EC; opacity: 0.6; cursor: pointer; font-size: 11px; padding: 0; }
  .scenario-editor input {
    background: rgba(255,255,255,0.1);
    border: 1px solid rgba(255,255,255,0.25);
    border-radius: 999px;
    color: #F5F2EC;
    font-size: 12px;
    padding: 5px 12px;
    width: 130px;
    font-family: var(--font-body);
  }
  .scenario-editor input::placeholder { color: #C9C4B8; }

  /* ---- Detail overlay ---- */
  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(15,14,12,0.86);
    display: none;
    z-index: 40;
    padding: env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px);
  }
  .overlay.show { display: flex; flex-direction: column; }
  .overlay-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 14px 16px;
    flex-shrink: 0;
  }
  .overlay-head .hint { color: #D8D3C8; font-size: 12.5px; }
  .overlay-head button {
    border: none;
    background: rgba(255,255,255,0.12);
    color: #F5F2EC;
    font-size: 13px;
    padding: 7px 13px;
    border-radius: 999px;
    cursor: pointer;
    font-family: var(--font-body);
  }
  .stage-wrap {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: auto;
    padding: 0 12px;
  }
  .stage {
    position: relative;
    max-width: 100%;
    max-height: 78vh;
    line-height: 0;
  }
  .stage img { max-width: 100%; max-height: 78vh; display: block; cursor: crosshair; border-radius: 2px; }
  .pin {
    position: absolute;
    width: 14px;
    height: 14px;
    margin-left: -7px;
    margin-top: -7px;
    border-radius: 50%;
    background: var(--buy);
    border: 2px solid var(--pin-ring);
    box-shadow: 0 1px 4px rgba(0,0,0,0.4);
    cursor: pointer;
  }
  .pin.owned { background: var(--own); }
  .pin.pulse { animation: pulse 1.1s ease-in-out infinite; }
  @keyframes pulse { 0%,100%{ transform: scale(1); } 50%{ transform: scale(1.5); } }

  .taglabel {
    position: absolute;
    transform: translate(-50%, -130%);
    background: rgba(23,22,19,0.86);
    color: #fff;
    font-size: 11.5px;
    padding: 3px 8px;
    border-radius: 4px;
    white-space: nowrap;
    pointer-events: none;
  }

  .popover {
    position: absolute;
    z-index: 5;
    background: var(--surface);
    border-radius: 6px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.35);
    padding: 10px;
    width: 220px;
  }
  .popover input {
    width: 100%;
    border: 1px solid var(--line-strong);
    border-radius: 4px;
    padding: 8px 9px;
    font-family: var(--font-body);
    font-size: 13.5px;
    color: var(--ink);
    background: var(--surface);
  }
  .popover .row { display: flex; gap: 6px; margin-top: 8px; }
  .popover button {
    font-family: var(--font-body);
    font-size: 12px;
    border-radius: 4px;
    border: 1px solid var(--line-strong);
    background: var(--surface-2);
    padding: 6px 10px;
    cursor: pointer;
    color: var(--ink);
  }
  .popover button.primary { background: var(--ink); color: var(--bg); border-color: var(--ink); flex: 1; }
  .popover .existing {
    margin-top: 6px;
    font-size: 11px;
    color: var(--ink-soft);
  }
  .popover .del-tag { color: #A5432C; border-color: transparent; background: none; padding: 4px 0; }

  footer.remove-photo {
    text-align: center;
    padding: 10px 0 4px;
  }
  footer.remove-photo button {
    border: none;
    background: none;
    color: #C9B9A6;
    font-size: 12px;
    cursor: pointer;
    text-decoration: underline;
  }

  input[type=file] { display: none; }

  .wardrobe-search {
    width: 100%;
    border: 1px solid var(--line-strong);
    border-radius: 999px;
    padding: 11px 16px;
    font-family: var(--font-body);
    font-size: 14px;
    color: var(--ink);
    background: var(--surface);
    margin-bottom: 14px;
  }
  .chip-row { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
  .chip-btn {
    border: 1px solid var(--line-strong);
    background: var(--surface);
    color: var(--ink);
    border-radius: 999px;
    padding: 6px 12px;
    font-family: var(--font-body);
    font-size: 12.5px;
    cursor: pointer;
  }
  .chip-btn.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  .filter-actions { display: flex; align-items: center; gap: 12px; padding: 0 4px 14px; }
  .filter-actions .label { font-size: 12px; color: var(--ink-soft); margin-right: auto; }
  .plain-btn {
    border: none;
    background: none;
    color: var(--ink-soft);
    text-decoration: underline;
    cursor: pointer;
    font-size: 12px;
    font-family: var(--font-body);
    padding: 0;
  }
  .view-pill {
    border: none;
    background: var(--buy);
    color: #211F1C;
    font-weight: 600;
    font-size: 11.5px;
    padding: 6px 12px;
    border-radius: 999px;
    cursor: pointer;
    font-family: var(--font-body);
  }

  .head-actions { display: flex; gap: 8px; }

  .crop-stage { position: relative; line-height: 0; touch-action: none; max-width: 100%; }
  .crop-stage img { max-width: 100%; max-height: 66vh; display: block; user-select: none; -webkit-user-drag: none; }
  .crop-box {
    position: absolute;
    border: 2px solid #fff;
    box-shadow: 0 0 0 9999px rgba(0,0,0,0.55);
    cursor: move;
    touch-action: none;
  }
  .crop-box i {
    position: absolute;
    width: 26px;
    height: 26px;
    margin: -13px 0 0 -13px;
    background: #fff;
    border-radius: 50%;
    box-shadow: 0 1px 4px rgba(0,0,0,0.5);
    touch-action: none;
  }
  .crop-box i[data-h="tl"] { left: 0; top: 0; }
  .crop-box i[data-h="tr"] { left: 100%; top: 0; }
  .crop-box i[data-h="bl"] { left: 0; top: 100%; }
  .crop-box i[data-h="br"] { left: 100%; top: 100%; }
  .crop-actions { padding: 14px 16px 18px; text-align: center; flex-shrink: 0; }
  .crop-actions button {
    border: none;
    background: var(--buy);
    color: #211F1C;
    font-weight: 600;
    font-size: 14px;
    padding: 11px 24px;
    border-radius: 999px;
    cursor: pointer;
    font-family: var(--font-body);
  }

  .inspo-form { display: flex; flex-direction: column; gap: 8px; margin-bottom: 22px; }
  .inspo-form input {
    border: 1px solid var(--line-strong);
    border-radius: 6px;
    padding: 10px 12px;
    font-family: var(--font-body);
    font-size: 14px;
    color: var(--ink);
    background: var(--surface);
  }
  .inspo-actions { display: flex; gap: 8px; }
  .inspo-actions button {
    border: 1px solid var(--line-strong);
    background: var(--surface);
    color: var(--ink);
    border-radius: 6px;
    padding: 9px 14px;
    font-size: 13px;
    cursor: pointer;
    font-family: var(--font-body);
  }
  .inspo-actions button.primary { background: var(--ink); color: var(--bg); border-color: var(--ink); flex: 1; }
  .inspo-link { flex: 1; min-width: 0; text-decoration: none; color: var(--ink); }
  .inspo-name { font-family: var(--font-display); font-size: 16.5px; display: block; }

  @media (max-width: 640px) {
    header.top { flex-direction: column; align-items: stretch; gap: 14px; }
    nav.tabs { display: flex; }
    nav.tabs button { flex: 1; padding: 7px 4px; }
  }

  .auth-screen {
    position: fixed;
    inset: 0;
    z-index: 60;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    padding: 24px;
    padding-top: calc(24px + env(safe-area-inset-top, 0px));
  }
  .auth-card { max-width: 340px; text-align: center; }
  .auth-card .mark { font-family: var(--font-display); font-weight: 500; font-size: 30px; margin-bottom: 10px; }
  .auth-card .mark .dot { color: var(--buy); }
  .auth-card p { color: var(--ink-soft); font-size: 14px; margin: 0 0 26px; line-height: 1.5; }
  .google-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    width: 100%;
    background: var(--surface);
    border: 1px solid var(--line-strong);
    border-radius: 6px;
    padding: 11px 16px;
    font-family: var(--font-body);
    font-size: 14px;
    font-weight: 500;
    color: var(--ink);
    cursor: pointer;
  }
  .auth-card .skip-link {
    display: block;
    margin: 16px auto 0;
    background: none;
    border: none;
    color: var(--ink-soft);
    font-size: 12.5px;
    text-decoration: underline;
    cursor: pointer;
    font-family: var(--font-body);
  }
  .auth-card .status { font-size: 12px; color: var(--ink-soft); margin-top: 14px; min-height: 16px; }

  .account {
    display: none;
    align-items: center;
    gap: 8px;
    font-size: 11.5px;
    color: var(--ink-soft);
    margin-top: 8px;
  }
  .account.show { display: flex; flex-wrap: wrap; }
  .account img { width: 18px; height: 18px; border-radius: 50%; }
  .account button {
    border: none;
    background: none;
    color: var(--ink-soft);
    text-decoration: underline;
    cursor: pointer;
    font-size: 11.5px;
    font-family: var(--font-body);
    padding: 0;
  }
</style>
</head>
<body>
<div class="auth-screen" id="authScreen">
  <div class="auth-card">
    <div class="mark">the edit<span class="dot">.</span></div>

        <path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.9-2.26c-.8.54-1.83.86-3.06.86-2.35 0-4.34-1.59-5.05-3.72H.96v2.33A9 9 0 0 0 9 18z"/>
        <path fill="#FBBC05" d="M3.95 10.7A5.4 5.4 0 0 1 3.68 9c0-.59.1-1.17.27-1.7V4.97H.96A9 9 0 0 0 0 9c0 1.45.35 2.83.96 4.03l2.99-2.33z"/>

<script>
(function(){
  var DB_NAME = 'the-edit-lookbook';
  var OLD_KEY = 'the-edit-lookbook-v1'; // previous localStorage version, migrated on first run
  var data = emptyData();
  var dbReady = null;
  // ---- Google Drive setup ----
  // Paste your OAuth Client ID here (Google Cloud console > APIs & Services > Credentials).
  // It is safe to publish: it only identifies the app, it is not a password.
  var CLIENT_ID = '101015241126-oibkrc63jbt8f5oa65455pemqgu24fep.apps.googleusercontent.com';
  var DRIVE_ENABLED = CLIENT_ID.indexOf('YOUR_') !== 0;
  var SCOPES = 'https://www.googleapis.com/auth/drive.file openid email profile';
  var TOKEN_KEY = 'the-edit-drive-token';
  var SIGNED_KEY = 'the-edit-signed-in';
  var USER_KEY = 'the-edit-user';
  var STATE_KEY = 'the-edit-oauth-state';

  function openDB(){
    if (dbReady) return dbReady;
    dbReady = new Promise(function(resolve, reject){
      if (!('indexedDB' in window)) { reject(new Error('no indexeddb')); return; }
      var req = indexedDB.open(DB_NAME, 1);
      req.onupgradeneeded = function(e){
        var db = e.target.result;
        if (!db.objectStoreNames.contains('photos')) db.createObjectStore('photos', { keyPath: 'id' });
        if (!db.objectStoreNames.contains('meta')) db.createObjectStore('meta', { keyPath: 'key' });
      };
      req.onsuccess = function(){ resolve(req.result); };
      req.onerror = function(){ reject(req.error); };
    });
    return dbReady;
  }
  function idbGetAll(store){
    return openDB().then(function(db){
      return new Promise(function(resolve, reject){
        var req = db.transaction(store, 'readonly').objectStore(store).getAll();
        req.onsuccess = function(){ resolve(req.result); };
        req.onerror = function(){ reject(req.error); };
      });
    });
  }
  function idbPut(store, value){
    return openDB().then(function(db){
      return new Promise(function(resolve, reject){
        var tx = db.transaction(store, 'readwrite');
        tx.objectStore(store).put(value);
        tx.oncomplete = function(){ resolve(); };
        tx.onerror = function(){ reject(tx.error); };
      });
    });
  }
  function idbDelete(store, key){
    return openDB().then(function(db){
      return new Promise(function(resolve, reject){
        var tx = db.transaction(store, 'readwrite');
        tx.objectStore(store).delete(key);
        tx.oncomplete = function(){ resolve(); };
        tx.onerror = function(){ reject(tx.error); };
      });
    });
  }
  function onSaveError(e){
    console.error(e);
    alert('Could not save that change — check your connection or device storage.');
  }

  // ---- Local (IndexedDB) persistence: the working copy on this device ----
  function emptyData(){
    return { photos: [], items: [], scenarios: [], inspo: [],
             metaUpdatedAt: 0, deleted: [], dirty: false, remoteStamp: null, localVersion: 0 };
  }
  function idbSaveMeta(){
    return idbPut('meta', {
      key: 'app', items: data.items, scenarios: data.scenarios, inspo: data.inspo,
      metaUpdatedAt: data.metaUpdatedAt, deleted: data.deleted, dirty: data.dirty, remoteStamp: data.remoteStamp
    }).catch(onSaveError);
  }
  function idbSavePhoto(p){ return idbPut('photos', p).catch(onSaveError); }
  function idbClear(store){
    return openDB().then(function(db){
      return new Promise(function(resolve, reject){
        var tx = db.transaction(store, 'readwrite');
        tx.objectStore(store).clear();
        tx.oncomplete = function(){ resolve(); };
        tx.onerror = function(){ reject(tx.error); };
      });
    });
  }

  function normalizeItems(){
    data.items.forEach(function(it){
      if (!it.seasons) it.seasons = [];
      if (it.buyLink === undefined) it.buyLink = null;
      if (it.category === undefined) it.category = null;
    });
  }

  // ---- Change tracking: every edit is saved locally first, then synced to Drive when connected ----
  function markDirty(){
    data.dirty = true;
    data.localVersion++;
    return idbSaveMeta();
  }
  function saveMeta(){
    data.metaUpdatedAt = Date.now();
    var r = markDirty();
    scheduleSync();
    return r;
  }
  function savePhoto(p){
    p.updatedAt = Date.now();
    var r = idbSavePhoto(p);
    markDirty();
    scheduleSync();
    return r;
  }
  function persistAllPhotos(){ data.photos.forEach(savePhoto); }
  function deletePhotoRecord(p){
    data.deleted.push({ id: p.id, fileId: p.fileId || null, done: false });
    idbDelete('photos', p.id).catch(onSaveError);
    markDirty();
    scheduleSync();
  }

  // ---- Google Drive sync ----
  var API = 'https://www.googleapis.com/drive/v3/files';
  var UPLOAD = 'https://www.googleapis.com/upload/drive/v3/files';
  var FOLDER_NAME = 'The Edit';
  var DATA_NAME = 'the-edit-data.json';

  var syncTimer = null;
  var syncing = false;
  var syncAgain = false;

  function dataUrlToBlob(u){
    var parts = u.split(',');
    var mime = (parts[0].match(/:(.*?);/) || [])[1] || 'image/jpeg';
    var bin = atob(parts[1]);
    var arr = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
    return new Blob([arr], { type: mime });
  }
  function blobToDataUrl(b){
    return new Promise(function(resolve, reject){
      var r = new FileReader();
      r.onload = function(){ resolve(r.result); };
      r.onerror = function(){ reject(r.error); };
      r.readAsDataURL(b);
    });
  }

  async function driveFetch(token, url, opts){
    opts = opts || {};
    opts.headers = Object.assign({ Authorization: 'Bearer ' + token }, opts.headers || {});
    var res = await fetch(url, opts);
    if (!res.ok){
      var err = new Error('Drive ' + res.status);
      err.status = res.status;
      throw err;
    }
    return res;
  }
  async function driveFindOne(token, q, fields){
    var res = await driveFetch(token, API + '?q=' + encodeURIComponent(q) +
      '&fields=' + encodeURIComponent('files(' + fields + ')') + '&pageSize=1&spaces=drive');
    var j = await res.json();
    return (j.files && j.files[0]) || null;
  }
  async function driveEnsureFolder(token){
    var f = await driveFindOne(token,
      "name='" + FOLDER_NAME + "' and mimeType='application/vnd.google-apps.folder' and 'root' in parents and trashed=false", 'id');
    if (f) return f.id;
    var res = await driveFetch(token, API + '?fields=id', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name: FOLDER_NAME, mimeType: 'application/vnd.google-apps.folder' })
    });
    return (await res.json()).id;
  }
  function multipart(meta, blob, mime){
    var boundary = 'edit' + uid() + uid();
    var head = '--' + boundary + '\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n' + JSON.stringify(meta) +
      '\r\n--' + boundary + '\r\nContent-Type: ' + mime + '\r\n\r\n';
    var tail = '\r\n--' + boundary + '--';
    return { body: new Blob([head, blob, tail]), type: 'multipart/related; boundary=' + boundary };
  }
  async function driveCreate(token, meta, blob, mime){
    var mp = multipart(meta, blob, mime);
    var res = await driveFetch(token, UPLOAD + '?uploadType=multipart&fields=id,modifiedTime', {
      method: 'POST', headers: { 'Content-Type': mp.type }, body: mp.body
    });
    return res.json();
  }
  async function driveUpdate(token, id, blob, mime){
    var res = await driveFetch(token, UPLOAD + '/' + id + '?uploadType=media&fields=id,modifiedTime', {
      method: 'PATCH', headers: { 'Content-Type': mime }, body: blob
    });
    return res.json();
  }

  function snapshot(){
    return {
      version: 1,
      updatedAt: Date.now(),
      metaUpdatedAt: data.metaUpdatedAt || 0,
      items: data.items, scenarios: data.scenarios, inspo: data.inspo,
      photos: data.photos.filter(function(p){ return p.fileId; }).map(function(p){
        return { id: p.id, fileId: p.fileId, tags: p.tags, scenarioIds: p.scenarioIds, addedAt: p.addedAt, updatedAt: p.updatedAt || 0 };
      }),
      deleted: data.deleted.map(function(t){ return { id: t.id, fileId: t.fileId || null, done: !!t.done }; })
    };
  }

  // Combine the Drive copy into the local copy. Photos are unioned (minus deletions);
  // per-photo tags and the wardrobe/scenario/inspo lists take whichever side was edited last.
  function mergeRemote(remote){
    var changed = false, needPush = false;
    var tombs = {};
    data.deleted.forEach(function(t){ tombs[t.id] = t; });
    (remote.deleted || []).forEach(function(t){
      if (!tombs[t.id]){
        var nt = { id: t.id, fileId: t.fileId || null, done: !!t.done };
        tombs[t.id] = nt;
        data.deleted.push(nt);
        changed = true;
      } else {
        if (!tombs[t.id].fileId && t.fileId) tombs[t.id].fileId = t.fileId;
        if (t.done) tombs[t.id].done = true;
      }
    });

    var remoteMeta = remote.metaUpdatedAt || 0, localMeta = data.metaUpdatedAt || 0;
    var localEmpty = !data.items.length && !data.scenarios.length && !data.inspo.length;
    var remoteHas = (remote.items || []).length + (remote.scenarios || []).length + (remote.inspo || []).length > 0;
    if (remoteMeta > localMeta || (localEmpty && remoteHas)){
      data.items = remote.items || [];
      data.scenarios = remote.scenarios || [];
      data.inspo = remote.inspo || [];
      data.metaUpdatedAt = Math.max(remoteMeta, localMeta);
      normalizeItems();
      changed = true;
    } else if (localMeta > remoteMeta){
      needPush = true;
    }

    var byId = {}, remoteIds = {};
    data.photos.forEach(function(p){ byId[p.id] = p; });
    (remote.photos || []).forEach(function(rp){
      if (tombs[rp.id]) return;
      remoteIds[rp.id] = true;
      var lp = byId[rp.id];
      if (!lp){
        data.photos.push({ id: rp.id, dataUrl: null, tags: rp.tags || [], scenarioIds: rp.scenarioIds || [],
                           addedAt: rp.addedAt || 0, updatedAt: rp.updatedAt || 0, fileId: rp.fileId });
        changed = true;
      } else {
        if (!lp.fileId && rp.fileId) lp.fileId = rp.fileId;
        var ru = rp.updatedAt || 0, lu = lp.updatedAt || 0;
        if (ru > lu){
          lp.tags = rp.tags || [];
          lp.scenarioIds = rp.scenarioIds || [];
          lp.updatedAt = ru;
          idbSavePhoto(lp);
          changed = true;
        } else if (lu > ru){
          needPush = true;
        }
      }
    });
    data.photos.forEach(function(p){
      if (p.dataUrl && p.fileId && !remoteIds[p.id] && !tombs[p.id]) needPush = true;
    });

    var before = data.photos.length;
    data.photos = data.photos.filter(function(p){
      if (tombs[p.id]){ idbDelete('photos', p.id).catch(function(){}); return false; }
      return true;
    });
    if (data.photos.length !== before) changed = true;
    data.photos.sort(function(a, b){ return (b.addedAt || 0) - (a.addedAt || 0); });
    return { changed: changed, needPush: needPush };
  }

  async function syncWithDrive(token){
    var folderId = await driveEnsureFolder(token);
    var df = await driveFindOne(token,
      "name='" + DATA_NAME + "' and '" + folderId + "' in parents and trashed=false", 'id,modifiedTime');
    var needPush = !!data.dirty || !df;
    var changedLocal = false;

    // 1. Pull if another device (or an earlier session) changed the Drive copy
    if (df && df.modifiedTime !== data.remoteStamp){
      var res = await driveFetch(token, API + '/' + df.id + '?alt=media');
      var remote = await res.json();
      var m = mergeRemote(remote);
      changedLocal = m.changed;
      needPush = needPush || m.needPush;
    }

    // 2. Download photos we don't have on this device yet
    var missing = data.photos.filter(function(p){ return !p.dataUrl; });
    for (var i = 0; i < missing.length; i++){
      var mp = missing[i];
      setSyncStatus('syncing', 'Downloading ' + (i + 1) + ' of ' + missing.length);
      try {
        var r = await driveFetch(token, API + '/' + mp.fileId + '?alt=media');
        mp.dataUrl = await blobToDataUrl(await r.blob());
        await idbSavePhoto(mp);
        changedLocal = true;
      } catch(e){
        if (e.status === 404){ mp._gone = true; needPush = true; } else throw e;
      }
    }
    if (missing.some(function(p){ return p._gone; })){
      data.photos = data.photos.filter(function(p){ return !p._gone; });
    }

    // 3. Upload photos that exist only on this device
    var toUpload = data.photos.filter(function(p){ return p.dataUrl && !p.fileId; });
    for (var j = 0; j < toUpload.length; j++){
      var up = toUpload[j];
      setSyncStatus('syncing', 'Uploading ' + (j + 1) + ' of ' + toUpload.length);
      var created = await driveCreate(token, { name: 'photo-' + up.id + '.jpg', parents: [folderId] },
                                      dataUrlToBlob(up.dataUrl), 'image/jpeg');
      up.fileId = created.id;
      await idbSavePhoto(up);
      needPush = true;
    }

    // 4. Remove Drive files for photos deleted on any device
    for (var k = 0; k < data.deleted.length; k++){
      var t = data.deleted[k];
      if (t.fileId && !t.done){
        try { await driveFetch(token, API + '/' + t.fileId, { method: 'DELETE' }); }
        catch(e){ if (e.status !== 404) throw e; }
        t.done = true;
        needPush = true;
      }
    }

    // 5. Write the small data file back if anything changed here
    if (needPush){
      if (!data.metaUpdatedAt && (data.items.length || data.scenarios.length || data.inspo.length)) data.metaUpdatedAt = Date.now();
      var version = data.localVersion;
      var blob = new Blob([JSON.stringify(snapshot())], { type: 'application/json' });
      var out = df
        ? await driveUpdate(token, df.id, blob, 'application/json')
        : await driveCreate(token, { name: DATA_NAME, parents: [folderId], mimeType: 'application/json' }, blob, 'application/json');
      data.remoteStamp = out.modifiedTime;
      if (data.localVersion === version) data.dirty = false;
    } else if (df){
      data.remoteStamp = df.modifiedTime;
    }
    await idbSaveMeta();
    if (changedLocal) refreshCurrentView();
  }

  function scheduleSync(){
    if (!DRIVE_ENABLED || !localStorage.getItem(SIGNED_KEY)) return;
    if (!getToken()){ setSyncStatus('paused'); return; }
    clearTimeout(syncTimer);
    syncTimer = setTimeout(runSync, 1500);
  }
  async function runSync(){
    if (!DRIVE_ENABLED) return;
    if (syncing){ syncAgain = true; return; }
    var token = getToken();
    if (!token){ setSyncStatus('paused'); return; }
    syncing = true;
    setSyncStatus('syncing');
    try {
      await syncWithDrive(token);
      setSyncStatus('ok');
    } catch(e){
      console.error(e);
      if (e && e.status === 401){ clearToken(); setSyncStatus('paused'); }
      else setSyncStatus('error');
    }
    syncing = false;
    if (syncAgain){ syncAgain = false; runSync(); }
  }

  function migrateFromLocalStorage(){
    var raw;
    try { raw = localStorage.getItem(OLD_KEY); } catch(e) { return Promise.resolve(); }
    if (!raw) return Promise.resolve();
    var old;
    try { old = JSON.parse(raw); } catch(e) { return Promise.resolve(); }
    if (!old || !old.photos) return Promise.resolve();
    var now = Date.now();
    var puts = old.photos.map(function(p, idx){
      p.addedAt = now - idx;
      if (!p.scenarioIds) p.scenarioIds = [];
      if (!p.tags) p.tags = [];
      return idbPut('photos', p);
    });
    puts.push(idbPut('meta', { key: 'app', items: old.items || [], scenarios: old.scenarios || [] }));
    return Promise.all(puts).then(function(){
      try { localStorage.removeItem(OLD_KEY); } catch(e){}
    });
  }

  function load(){
    return idbGetAll('photos').catch(function(){ return []; }).then(function(existing){
      if (existing.length > 0) return existing;
      return migrateFromLocalStorage().then(function(){ return idbGetAll('photos').catch(function(){ return []; }); });
    }).then(function(photos){
      photos.sort(function(a,b){ return (b.addedAt||0) - (a.addedAt||0); });
      photos.forEach(function(p){ if (!p.scenarioIds) p.scenarioIds = []; if (!p.tags) p.tags = []; });
      data.photos = photos;
      return idbGetAll('meta').catch(function(){ return []; });
    }).then(function(metaRows){
      var meta = metaRows[0] || { items: [], scenarios: [] };
      data.items = meta.items || [];
      data.scenarios = meta.scenarios || [];
      data.inspo = meta.inspo || [];
      data.metaUpdatedAt = meta.metaUpdatedAt || 0;
      data.deleted = meta.deleted || [];
      data.dirty = !!meta.dirty;
      data.remoteStamp = meta.remoteStamp || null;
      normalizeItems();
    }).catch(function(e){
      console.error(e);
      alert('Your browser doesn\'t support on-device storage here, so nothing will be saved between visits.');
    });
  }
  function uid(){ return Math.random().toString(36).slice(2,10) + Date.now().toString(36).slice(-4); }

  var SEASONS = [
    { key: 'spring', icon: '🌱', label: 'Spring' },
    { key: 'summer', icon: '☀️', label: 'Summer' },
    { key: 'autumn', icon: '🍂', label: 'Autumn' },
    { key: 'winter', icon: '❄️', label: 'Winter' }
  ];
  function seasonLabel(key){
    var s = SEASONS.find(function(x){ return x.key === key; });
    return s ? s.label : key;
  }
  // Renders a row of season toggle buttons into `container`.
  // getSeasons()/onToggle(key) let callers back this with either a real item or a staged array.
  function renderSeasonIcons(container, getSeasons, onToggle, small){
    var cls = 'season-btn' + (small ? ' small' : '');
    container.innerHTML = SEASONS.map(function(s){
      var on = getSeasons().indexOf(s.key) !== -1;
      return '<button type="button" class="'+cls+(on?' on':'')+'" data-key="'+s.key+'" title="'+s.label+'">'+s.icon+'</button>';
    }).join('');
    container.querySelectorAll('.season-btn').forEach(function(b){
      b.addEventListener('click', function(ev){
        ev.stopPropagation();
        onToggle(b.getAttribute('data-key'));
        renderSeasonIcons(container, getSeasons, onToggle, small);
      });
    });
  }

  var CATEGORIES = [
    { key: 'tops', icon: '👕', label: 'Tops' },
    { key: 'bottoms', icon: '👖', label: 'Bottoms' },
    { key: 'dresses', icon: '👗', label: 'Dresses' },
    { key: 'outerwear', icon: '🧥', label: 'Jackets' },
    { key: 'shoes', icon: '👟', label: 'Shoes' },
    { key: 'accessories', icon: '👜', label: 'Accessories' }
  ];
  function categoryLabel(key){
    var c = CATEGORIES.find(function(x){ return x.key === key; });
    return c ? c.label : key;
  }
  // Renders a row of single-select category buttons. getCategory() returns the current key or null;
  // clicking a selected one clears it. onSelect(key|null) applies the change.
  function renderCategoryIcons(container, getCategory, onSelect, small){
    var current = getCategory();
    var cls = 'season-btn' + (small ? ' small' : '');
    container.innerHTML = CATEGORIES.map(function(c){
      var on = current === c.key;
      return '<button type="button" class="'+cls+(on?' on':'')+'" data-key="'+c.key+'" title="'+c.label+'">'+c.icon+'</button>';
    }).join('');
    container.querySelectorAll('.season-btn').forEach(function(b){
      b.addEventListener('click', function(ev){
        ev.stopPropagation();
        var key = b.getAttribute('data-key');
        onSelect(current === key ? null : key);
        renderCategoryIcons(container, getCategory, onSelect, small);
      });
    });
  }

  function findOrCreateItem(rawName){
    var name = rawName.trim();
    if (!name) return null;
    var key = name.toLowerCase();
    var found = data.items.find(function(it){ return it.name.toLowerCase() === key; });
    if (found) return found;
    var item = { id: uid(), name: name, status: null, seasons: [], buyLink: null, category: null };
    data.items.push(item);
    return item;
  }

  function itemPhotoCount(itemId){
    var count = 0;
    data.photos.forEach(function(p){
      if (p.tags.some(function(t){ return t.itemId === itemId; })) count++;
    });
    return count;
  }

  function findOrCreateScenario(rawName){
    var name = rawName.trim();
    if (!name) return null;
    var key = name.toLowerCase();
    var found = data.scenarios.find(function(s){ return s.name.toLowerCase() === key; });
    if (found) return found;
    var scenario = { id: uid(), name: name };
    data.scenarios.push(scenario);
    return scenario;
  }
  function scenarioPhotoCount(scenarioId){
    return data.photos.filter(function(p){ return p.scenarioIds.indexOf(scenarioId) !== -1; }).length;
  }
  function photoMatchesFilter(p, filter){
    if (!filter) return true;
    if (filter.type === 'scenario') return p.scenarioIds.indexOf(filter.ids[0]) !== -1;
    var tagItemIds = p.tags.map(function(t){ return t.itemId; });
    if (filter.mode === 'all') return filter.ids.every(function(id){ return tagItemIds.indexOf(id) !== -1; });
    return filter.ids.some(function(id){ return tagItemIds.indexOf(id) !== -1; });
  }

  function filterByItem(itemIds, mode){

  // The search box lives outside #wardrobeBody so it keeps focus while you type.
  function renderWardrobe(){
    if (data.items.length === 0){
      wardrobeView.innerHTML = '<div class="empty"><div class="big">Nothing tagged yet</div>' +
        'Tag a few pieces on the Board and they\'ll collect here, ready to mark as owned or on the list to buy.</div>';

  function renderWardrobeBody(){
    var body = document.getElementById('wardrobeBody');
    if (!body) return;
    var terms = wardrobeSearchTerm.toLowerCase().split(/\s+/).filter(Boolean);
    var visible = data.items.filter(function(it){
      var hay = (it.name + ' ' + (it.category ? categoryLabel(it.category) : '')).toLowerCase();
      if (!terms.every(function(t){ return hay.indexOf(t) !== -1; })) return false;
      if (wardrobeSeasonFilter.length && !it.seasons.some(function(s){ return wardrobeSeasonFilter.indexOf(s) !== -1; })) return false;
      if (wardrobeCategoryFilter.length && wardrobeCategoryFilter.indexOf(it.category) === -1) return false;
      return true;
    });
    var sorted = visible.slice().sort(function(a,b){ return a.name.localeCompare(b.name); });
    var anyFilter = terms.length > 0 || wardrobeSeasonFilter.length > 0 || wardrobeCategoryFilter.length > 0;

    var html = '<div class="chip-row">' + CATEGORIES.map(function(c){
      var on = wardrobeCategoryFilter.indexOf(c.key) !== -1;

    }).join('') + '</div>';
    html += '<div class="season-filter"><span class="label">Season</span>' + SEASONS.map(function(s){

    if (sorted.length === 0){

    body.querySelectorAll('.season-filter .season-btn').forEach(function(b){
      b.addEventListener('click', function(){
        var key = b.getAttribute('data-key');

        renderWardrobeBody();
      });

    var clearBtn = document.getElementById('clearWardrobeFilters');
    if (clearBtn) clearBtn.addEventListener('click', function(){
      wardrobeSeasonFilter = [];
      wardrobeCategoryFilter = [];
      wardrobeSearchTerm = '';
      var si = document.getElementById('wardrobeSearch');
      if (si) si.value = '';
      renderWardrobeBody();
    });
    var viewBtn = document.getElementById('viewFilteredOnBoard');
    if (viewBtn) viewBtn.addEventListener('click', function(){
      var parts = [];
      if (terms.length) parts.push('\u201C' + wardrobeSearchTerm.trim() + '\u201D');
      wardrobeCategoryFilter.forEach(function(k){ parts.push(categoryLabel(k)); });
      wardrobeSeasonFilter.forEach(function(k){ parts.push(seasonLabel(k)); });
      filterByVisibleItems(sorted.map(function(i){ return i.id; }), parts.join(' · '));

    // Per-item season toggles
    body.querySelectorAll('.season-row').forEach(function(row){
      var itemId = row.getAttribute('data-item');
      var it = data.items.find(function(i){ return i.id === itemId; });
      renderSeasonIcons(row, function(){ return it.seasons; }, function(key){
        var idx = it.seasons.indexOf(key);
        if (idx === -1) it.seasons.push(key); else it.seasons.splice(idx, 1);
        saveMeta();
      });

    // Buy-link editor per item
    body.querySelectorAll('.buy-link').forEach(function(el){
      var itemId = el.getAttribute('data-link-item');

    body.querySelectorAll('.pick').forEach(function(b){
      b.addEventListener('click', function(){

    body.querySelectorAll('.status-toggle button').forEach(function(b){
      b.addEventListener('click', function(){
        var it = data.items.find(function(i){ return i.id === b.getAttribute('data-id'); });
        var status = b.getAttribute('data-status');
        it.status = (it.status === status) ? null : status;
        saveMeta();
        renderWardrobeBody();
      });
    });
    body.querySelectorAll('.del').forEach(function(b){
      b.addEventListener('click', function(){
        var id = b.getAttribute('data-id');
        if (!confirm('Remove this item and its tags from every photo?')) return;
        data.items = data.items.filter(function(i){ return i.id !== id; });
        data.photos.forEach(function(p){ p.tags = p.tags.filter(function(t){ return t.itemId !== id; }); });
        selectedItemIds = selectedItemIds.filter(function(x){ return x !== id; });
        saveMeta();
        persistAllPhotos();
        renderWardrobe();
      });

    var bar = document.getElementById('selectbar');
    if (selectedItemIds.length > 1){
      bar.classList.add('show');
      document.getElementById('selectCount').textContent = selectedItemIds.length + ' selected';
      bar.querySelectorAll('.mode-toggle button').forEach(function(b){
        b.addEventListener('click', function(){ selectMode = b.getAttribute('data-mode'); renderWardrobeBody(); });
      });
      document.getElementById('viewSelected').addEventListener('click', function(){
        filterByItem(selectedItemIds.slice(), selectMode);
      });
    }

  function hostnameOf(url){
    try { return new URL(url).hostname.replace(/^www\./, ''); }
    catch(e){ return url; }
  }
  function renderBuyLink(el, it){
    if (editingLinkId === it.id){
      el.innerHTML = '<input type="url" placeholder="https://…" id="linkInput" value="'+(it.buyLink ? escapeHtml(it.buyLink) : '')+'">' +
        '<button class="linkbtn" id="saveLinkBtn">Save</button>';
      var input = el.querySelector('#linkInput');
      input.focus();
      var commit = function(){
        var v = input.value.trim();
        it.buyLink = v ? v : null;
        saveMeta();
        editingLinkId = null;
        renderWardrobeBody();
      };
      input.addEventListener('keydown', function(e){
        if (e.key === 'Enter') commit();
        if (e.key === 'Escape'){ editingLinkId = null; renderWardrobeBody(); }
      });
      el.querySelector('#saveLinkBtn').addEventListener('click', commit);
    } else if (it.buyLink){
      el.innerHTML = '<a href="'+escapeHtml(it.buyLink)+'" target="_blank" rel="noopener">🔗 '+escapeHtml(hostnameOf(it.buyLink))+'</a>' +

    } else {
      el.innerHTML = '<button class="linkbtn" id="addLinkBtn">+ Add purchase link</button>';
      el.querySelector('#addLinkBtn').addEventListener('click', function(){ editingLinkId = it.id; renderWardrobeBody(); });
    }

  function escapeHtml(s){
    return s.replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }

  // ---------- Inspo ----------
  var editingInspoId = null;

  function normalizeLink(v){
    v = (v || '').trim();
    if (!v) return '';
    if (v.charAt(0) === '@') return 'https://www.instagram.com/' + v.slice(1).replace(/\/+$/, '');
    if (/^https?:\/\//i.test(v)) return v;
    if (/^[A-Za-z0-9_]+$/.test(v)) return 'https://www.instagram.com/' + v;
    return 'https://' + v;
  }
  function linkLabel(url){
    try {
      var u = new URL(url);
      var h = u.hostname.replace(/^www\./, '');
      if (h === 'instagram.com'){
        var seg = u.pathname.split('/').filter(Boolean)[0];
        return seg ? '@' + seg : 'instagram.com';
      }
      return h;
    } catch(e){ return url; }
  }

  function renderInspo(){
    var editing = editingInspoId ? data.inspo.find(function(x){ return x.id === editingInspoId; }) : null;
    var html = '<div class="inspo-form">' +
      '<input type="text" id="inspoName" placeholder="Name — e.g. Jane Doe" autocomplete="off" value="'+(editing ? escapeHtml(editing.name) : '')+'">' +
      '<input type="text" id="inspoLink" placeholder="Instagram link or @handle" autocomplete="off" value="'+(editing && editing.url ? escapeHtml(editing.url) : '')+'">' +
      '<div class="inspo-actions"><button class="primary" id="inspoSave">'+(editing ? 'Save changes' : 'Add person')+'</button>' +
      (editing ? '<button id="inspoCancel">Cancel</button>' : '') + '</div></div>';
    if (!data.inspo.length){
      html += '<div class="empty"><div class="big">No inspiration yet</div>Save people whose style you love — tap a name later to jump straight to their page.</div>';
    } else {
      html += '<div class="wlist">';
      data.inspo.forEach(function(x){
        html += '<div class="witem"><div class="row-top">' +
          (x.url
            ? '<a class="inspo-link" href="'+escapeHtml(x.url)+'" target="_blank" rel="noopener"><span class="inspo-name">'+escapeHtml(x.name)+'</span><span class="count">'+escapeHtml(linkLabel(x.url))+' ↗</span></a>'
            : '<div class="inspo-link"><span class="inspo-name">'+escapeHtml(x.name)+'</span></div>') +
          '<button class="plain-btn edit-inspo" data-id="'+x.id+'">Edit</button>' +
          '<button class="del" data-id="'+x.id+'" title="Remove">✕</button>' +
          '</div></div>';
      });
      html += '</div>';
    }
    inspoView.innerHTML = html;

    var nameEl = document.getElementById('inspoName');
    var linkEl = document.getElementById('inspoLink');
    var save = function(){
      var name = nameEl.value.trim();
      if (!name){ nameEl.focus(); return; }
      var url = normalizeLink(linkEl.value);
      if (editing){ editing.name = name; editing.url = url; }
      else data.inspo.unshift({ id: uid(), name: name, url: url });
      editingInspoId = null;
      saveMeta();
      renderInspo();
    };
    document.getElementById('inspoSave').addEventListener('click', save);
    [nameEl, linkEl].forEach(function(el){
      el.addEventListener('keydown', function(e){ if (e.key === 'Enter') save(); });
    });
    var cancel = document.getElementById('inspoCancel');
    if (cancel) cancel.addEventListener('click', function(){ editingInspoId = null; renderInspo(); });
    inspoView.querySelectorAll('.edit-inspo').forEach(function(b){
      b.addEventListener('click', function(){ editingInspoId = b.getAttribute('data-id'); renderInspo(); window.scrollTo(0, 0); });
    });
    inspoView.querySelectorAll('.del').forEach(function(b){
      b.addEventListener('click', function(){
        if (!confirm('Remove this person?')) return;
        var id = b.getAttribute('data-id');
        data.inspo = data.inspo.filter(function(x){ return x.id !== id; });
        saveMeta();
        renderInspo();
      });
    });
  }

  // ---------- File add + crop ----------
  var fileInput = document.getElementById('fileInput');
  function openFilePicker(){ fileInput.click(); }

  var uploadQueue = [];
  var uploadBusy = false;

  fileInput.addEventListener('change', function(e){
    var files = Array.prototype.slice.call(e.target.files || []);
    if (!files.length) return;
    var reads = files.map(function(file){
      return new Promise(function(resolve){
        var r = new FileReader();
        r.onload = function(ev){ resolve(ev.target.result); };
        r.onerror = function(){ resolve(null); };
        r.readAsDataURL(file);
      });
    });
    Promise.all(reads).then(function(urls){
      fileInput.value = '';
      urls.forEach(function(u){ if (u) uploadQueue.push(u); });
      activeFilter = null;
      filterBar.classList.remove('show');
      if (!uploadBusy) processNextUpload();
    });
  });

  function processNextUpload(){
    if (!uploadQueue.length){ uploadBusy = false; renderBoard(); return; }
    uploadBusy = true;
    openCrop(uploadQueue.shift());
  }
  // After tagging a new photo (or a normal photo), carry on with the next upload or refresh the board.
  function afterOverlayClosed(){
    if (uploadBusy) processNextUpload(); else renderBoard();
  }

  function compressImage(dataUrl, cb){
    var img = new Image();
    img.onload = function(){
      var maxDim = 1100;
      var scale = Math.min(1, maxDim / Math.max(img.width, img.height));
      var w = Math.round(img.width * scale), h = Math.round(img.height * scale);
      var canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      cb(canvas.toDataURL('image/jpeg', 0.82));
    };
    img.onerror = function(){ cb(dataUrl); };
    img.src = dataUrl;
  }

  var cropOverlay = document.getElementById('cropOverlay');
  var cropImg = document.getElementById('cropImg');
  var cropBox = document.getElementById('cropBox');
  var cropSource = null;
  var cropRect = { x: 0, y: 0, w: 0, h: 0 };
  var cropDrag = null;

  function clamp(v, lo, hi){ return Math.max(lo, Math.min(hi, v)); }

  function openCrop(dataUrl){
    cropSource = dataUrl;
    cropOverlay.classList.add('show');
    cropImg.onload = function(){
      cropRect = { x: 0, y: 0, w: cropImg.clientWidth, h: cropImg.clientHeight };
      updateCropBox();
    };
    cropImg.src = dataUrl;
  }
  function updateCropBox(){
    cropBox.style.left = cropRect.x + 'px';
    cropBox.style.top = cropRect.y + 'px';
    cropBox.style.width = cropRect.w + 'px';
    cropBox.style.height = cropRect.h + 'px';
  }
  cropBox.addEventListener('pointerdown', function(e){
    var h = e.target.getAttribute ? e.target.getAttribute('data-h') : null;
    cropDrag = { mode: h || 'move', sx: e.clientX, sy: e.clientY, r: { x: cropRect.x, y: cropRect.y, w: cropRect.w, h: cropRect.h } };
    try { cropBox.setPointerCapture(e.pointerId); } catch(err){}
    e.preventDefault();
  });
  cropBox.addEventListener('pointermove', function(e){
    if (!cropDrag) return;
    var W = cropImg.clientWidth, H = cropImg.clientHeight, MIN = 48;
    var dx = e.clientX - cropDrag.sx, dy = e.clientY - cropDrag.sy;
    var s = cropDrag.r, m = cropDrag.mode;
    var r = { x: s.x, y: s.y, w: s.w, h: s.h };
    if (m === 'move'){
      r.x = clamp(s.x + dx, 0, W - s.w);
      r.y = clamp(s.y + dy, 0, H - s.h);
    } else {
      if (m.indexOf('l') !== -1){ var nx = clamp(s.x + dx, 0, s.x + s.w - MIN); r.w = s.x + s.w - nx; r.x = nx; }
      if (m.indexOf('r') !== -1){ r.w = clamp(s.w + dx, MIN, W - s.x); }
      if (m.indexOf('t') !== -1){ var ny = clamp(s.y + dy, 0, s.y + s.h - MIN); r.h = s.y + s.h - ny; r.y = ny; }
      if (m.indexOf('b') !== -1){ r.h = clamp(s.h + dy, MIN, H - s.y); }
    }
    cropRect = r;
    updateCropBox();
  });
  function endCropDrag(){ cropDrag = null; }
  cropBox.addEventListener('pointerup', endCropDrag);
  cropBox.addEventListener('pointercancel', endCropDrag);

  // Save the (cropped or full) photo, then go straight into pinning it.
  function finishCrop(dataUrl){
    compressImage(dataUrl, function(out){
      var photo = { id: uid(), dataUrl: out, tags: [], scenarioIds: [], addedAt: Date.now() };
      data.photos.unshift(photo);
      data.photos.sort(function(a,b){ return (b.addedAt||0) - (a.addedAt||0); });
      savePhoto(photo);
      cropOverlay.classList.remove('show');
      openDetail(photo.id);
    });
  }
  document.getElementById('cropSkip').addEventListener('click', function(){ finishCrop(cropSource); });
  document.getElementById('cropApply').addEventListener('click', function(){
    var img = new Image();
    img.onload = function(){
      var scale = img.naturalWidth / cropImg.clientWidth;
      var sw = Math.max(1, Math.round(cropRect.w * scale)), sh = Math.max(1, Math.round(cropRect.h * scale));
      var canvas = document.createElement('canvas');
      canvas.width = sw; canvas.height = sh;
      canvas.getContext('2d').drawImage(img, Math.round(cropRect.x * scale), Math.round(cropRect.y * scale), sw, sh, 0, 0, sw, sh);
      finishCrop(canvas.toDataURL('image/jpeg', 0.92));
    };
    img.src = cropSource;
  });

  // ---------- Detail / tagging overlay ----------
  var overlay = document.getElementById('overlay');
  var stage = document.getElementById('stage');
  var stageImg = document.getElementById('stageImg');
  var currentPhotoId = null;

  function openDetail(photoId){
    currentPhotoId = photoId;
    var p = data.photos.find(function(x){ return x.id === photoId; });
    stageImg.src = p.dataUrl;
    overlay.classList.add('show');
    renderPins();
    renderScenarioEditor();
  }
  document.getElementById('closeOverlay').addEventListener('click', function(){
    overlay.classList.remove('show');
    closePopover();
    afterOverlayClosed();
  });

  // Google Lens: one tap when the photo is stored online (signed in); otherwise open Lens to upload manually.
  document.getElementById('lensBtn').addEventListener('click', function(){
    var p = data.photos.find(function(x){ return x.id === currentPhotoId; });
    if (!p) return;
    if (/^https?:\/\//i.test(p.dataUrl)){
      window.open('https://lens.google.com/uploadbyurl?url=' + encodeURIComponent(p.dataUrl), '_blank', 'noopener');
    } else {
      alert('Your photos are private, so Lens can\'t fetch them by itself. Lens will open now: tap the image icon there and choose this photo from your gallery.');
      window.open('https://lens.google.com/', '_blank', 'noopener');
    }
  });

  var scenarioEditor = document.getElementById('scenarioEditor');
  function renderScenarioEditor(){
    var p = data.photos.find(function(x){ return x.id === currentPhotoId; });
    var html = '';
    p.scenarioIds.forEach(function(id){
      var s = data.scenarios.find(function(x){ return x.id === id; });
      if (!s) return;
      html += '<span class="chip">'+escapeHtml(s.name)+'<button data-id="'+id+'">✕</button></span>';
    });
    html += '<input type="text" id="scenarioInput" placeholder="Add a scenario, e.g. Gym">';
    scenarioEditor.innerHTML = html;
    scenarioEditor.querySelectorAll('.chip button').forEach(function(b){
      b.addEventListener('click', function(){
        var id = b.getAttribute('data-id');
        p.scenarioIds = p.scenarioIds.filter(function(x){ return x !== id; });
        savePhoto(p);
        renderScenarioEditor();
      });
    });
    var input = document.getElementById('scenarioInput');
    input.addEventListener('keydown', function(e){
      if (e.key === 'Enter'){
        var name = input.value.trim();
        if (!name) return;
        var s = findOrCreateScenario(name);
        if (p.scenarioIds.indexOf(s.id) === -1) p.scenarioIds.push(s.id);
        saveMeta();
        savePhoto(p);
        renderScenarioEditor();
      }
    });
  }
  document.getElementById('removePhoto').addEventListener('click', function(){
    if (!confirm('Remove this photo and its tags?')) return;
    var gone = data.photos.find(function(p){ return p.id === currentPhotoId; });
    data.photos = data.photos.filter(function(p){ return p.id !== currentPhotoId; });
    if (gone) deletePhotoRecord(gone);
    overlay.classList.remove('show');
    closePopover();
    afterOverlayClosed();
  });

  function renderPins(){
    stage.querySelectorAll('.pin, .taglabel').forEach(function(el){ el.remove(); });
    var p = data.photos.find(function(x){ return x.id === currentPhotoId; });
    p.tags.forEach(function(t){
      var item = data.items.find(function(i){ return i.id === t.itemId; });
      if (!item) return;
      var pin = document.createElement('div');
      pin.className = 'pin' + (item.status === 'own' ? ' owned' : '');
      if (activeFilter && activeFilter.type === 'item' && activeFilter.ids.indexOf(t.itemId) !== -1) pin.classList.add('pulse');
      pin.style.left = t.x + '%';
      pin.style.top = t.y + '%';
      pin.addEventListener('click', function(ev){
        ev.stopPropagation();
        openPinPopover(t, item, pin);
      });
      stage.appendChild(pin);
    });
  }

  stage.addEventListener('click', function(ev){
    if (ev.target !== stageImg) return;
    closePopover();
    var rect = stageImg.getBoundingClientRect();
    var stageRect = stage.getBoundingClientRect();
    var x = ((ev.clientX - rect.left) / rect.width) * 100;
    var y = ((ev.clientY - rect.top) / rect.height) * 100;
    var px = ev.clientX - stageRect.left;
    var py = ev.clientY - stageRect.top;
    openNewTagPopover(x, y, px, py);
  });

  var openPop = null;
  function closePopover(){ if (openPop){ openPop.remove(); openPop = null; } }

  // Keep a popover inside the photo: centred on the tap, flipped above if there's no room below.
  function positionPopover(pop, px, py){
    var w = pop.offsetWidth, h = pop.offsetHeight;
    var sw = stage.clientWidth, sh = stage.clientHeight;
    var left = clamp(px - w / 2, 4, Math.max(4, sw - w - 4));
    var top = py + 14;
    if (top + h > sh - 4) top = Math.max(4, py - h - 14);
    pop.style.left = left + 'px';
    pop.style.top = top + 'px';
  }

  function openNewTagPopover(xPct, yPct, px, py){
    closePopover();
    var pendingSeasons = [];
    var pendingCategory = null;
    var pendingStatus = null;
    var pop = document.createElement('div');
    pop.className = 'popover';
    pop.innerHTML = '<input type="text" placeholder="e.g. Navy loafer" id="newTagInput" autocomplete="off">' +
      '<div class="season-row" id="newTagCategory" style="margin-top:8px;"></div>' +
      '<div class="season-row" id="newTagSeasons" style="margin-top:6px;"></div>' +
      '<div class="row"><button id="npOwn" style="flex:1;">Own</button><button id="npBuy" style="flex:1;">To buy</button></div>' +
      '<div class="row"><button class="primary" id="saveTagBtn">Add pin</button>' +
      '<button id="cancelTagBtn">Cancel</button></div>';
    stage.appendChild(pop);
    openPop = pop;
    var input = pop.querySelector('#newTagInput');
    var ownBtn = pop.querySelector('#npOwn');
    var buyBtn = pop.querySelector('#npBuy');
    renderCategoryIcons(pop.querySelector('#newTagCategory'), function(){ return pendingCategory; }, function(key){ pendingCategory = key; }, true);
    renderSeasonIcons(pop.querySelector('#newTagSeasons'), function(){ return pendingSeasons; }, function(key){
      var idx = pendingSeasons.indexOf(key);
      if (idx === -1) pendingSeasons.push(key); else pendingSeasons.splice(idx, 1);
    }, true);
    function setStatus(s){
      pendingStatus = (pendingStatus === s) ? null : s;
      ownBtn.className = pendingStatus === 'own' ? 'primary' : '';
      buyBtn.className = pendingStatus === 'buy' ? 'primary' : '';
    }
    ownBtn.addEventListener('click', function(){ setStatus('own'); });
    buyBtn.addEventListener('click', function(){ setStatus('buy'); });
    positionPopover(pop, px, py);
    input.focus();
    function commit(){
      var name = input.value.trim();
      if (!name) { closePopover(); return; }
      var item = findOrCreateItem(name);
      pendingSeasons.forEach(function(k){ if (item.seasons.indexOf(k) === -1) item.seasons.push(k); });
      if (pendingCategory) item.category = pendingCategory;
      if (pendingStatus) item.status = pendingStatus;
      var p = data.photos.find(function(x){ return x.id === currentPhotoId; });
      p.tags.push({ id: uid(), itemId: item.id, x: xPct, y: yPct });
      saveMeta();
      savePhoto(p);
      closePopover();
      renderPins();
    }
    input.addEventListener('keydown', function(e){ if (e.key === 'Enter') commit(); if (e.key === 'Escape') closePopover(); });
    pop.querySelector('#saveTagBtn').addEventListener('click', commit);
    pop.querySelector('#cancelTagBtn').addEventListener('click', closePopover);
  }

  function openPinPopover(tag, item, pinEl){
    closePopover();
    var pop = document.createElement('div');
    pop.className = 'popover';
    pop.innerHTML = '<div style="font-family:var(--font-display);font-size:15px;">'+escapeHtml(item.name)+'</div>' +
      '<div class="season-row" id="pinCategory" style="margin:8px 0 6px;"></div>' +
      '<div class="season-row" id="pinSeasons" style="margin-bottom:8px;"></div>' +
      '<div class="row">' +
        '<button class="'+(item.status==='own'?'primary':'')+'" id="pinOwn" style="flex:1;">Own</button>' +
        '<button class="'+(item.status==='buy'?'primary':'')+'" id="pinBuy" style="flex:1;">To buy</button>' +
      '</div>' +
      '<button class="del-tag" id="pinDel">Remove this pin</button>';
    stage.appendChild(pop);
    openPop = pop;
    renderCategoryIcons(pop.querySelector('#pinCategory'), function(){ return item.category; }, function(key){
      item.category = key;
      saveMeta();
    }, true);
    renderSeasonIcons(pop.querySelector('#pinSeasons'), function(){ return item.seasons; }, function(key){
      var idx = item.seasons.indexOf(key);
      if (idx === -1) item.seasons.push(key); else item.seasons.splice(idx, 1);
      saveMeta();
    }, true);
    pop.querySelector('#pinOwn').addEventListener('click', function(){
      item.status = item.status === 'own' ? null : 'own'; saveMeta(); renderPins(); closePopover();
    });
    pop.querySelector('#pinBuy').addEventListener('click', function(){
      item.status = item.status === 'buy' ? null : 'buy'; saveMeta(); renderPins(); closePopover();
    });
    pop.querySelector('#pinDel').addEventListener('click', function(){
      var p = data.photos.find(function(x){ return x.id === currentPhotoId; });
      p.tags = p.tags.filter(function(t){ return t.id !== tag.id; });
      savePhoto(p); closePopover(); renderPins();
    });
    positionPopover(pop,
      parseFloat(pinEl.style.left) / 100 * stage.clientWidth,
      parseFloat(pinEl.style.top) / 100 * stage.clientHeight);
  }

  // ---------- Google account ----------
  var authScreen = document.getElementById('authScreen');
  var authStatus = document.getElementById('authStatus');
  var accountBar = document.getElementById('accountBar');
  var accountAvatar = document.getElementById('accountAvatar');
  var accountName = document.getElementById('accountName');
  var syncStatusEl = document.getElementById('syncStatus');
  var reconnectBtn = document.getElementById('reconnectBtn');
  var signInBtn = document.getElementById('signInBtn');
  var signOutBtn = document.getElementById('signOutBtn');

  function showAuthScreen(show){ authScreen.style.display = show ? 'flex' : 'none'; }

  function storeToken(token, expiresIn){
    try {
      localStorage.setItem(TOKEN_KEY, JSON.stringify({ t: token, exp: Date.now() + (expiresIn || 3600) * 1000 - 60000 }));
    } catch(e){}
    clearTimeout(expiryTimer);
    expiryTimer = setTimeout(function(){ setSyncStatus('paused'); }, Math.max(1000, (expiresIn || 3600) * 1000 - 60000));
  }
  function getToken(){
    try {
      var v = JSON.parse(localStorage.getItem(TOKEN_KEY) || 'null');
      if (v && v.exp > Date.now()) return v.t;
    } catch(e){}
    return null;
  }
  function clearToken(){ try { localStorage.removeItem(TOKEN_KEY); } catch(e){} }
  var expiryTimer = null;

  function cachedUser(){
    try { return JSON.parse(localStorage.getItem(USER_KEY) || 'null'); } catch(e){ return null; }
  }
  async function fetchUserinfo(token){
    try {
      var res = await fetch('https://www.googleapis.com/oauth2/v3/userinfo', { headers: { Authorization: 'Bearer ' + token } });
      if (!res.ok) return;
      var j = await res.json();
      localStorage.setItem(USER_KEY, JSON.stringify({ name: j.name || j.email || '', picture: j.picture || '' }));
      renderAccountBar();
    } catch(e){}
  }

  var syncState = 'idle';
  var syncDetail = '';
  function setSyncStatus(state, detail){
    syncState = state;
    syncDetail = detail || '';
    renderAccountBar();
  }
  function renderAccountBar(){
    if (!DRIVE_ENABLED){ accountBar.classList.remove('show'); return; }
    accountBar.classList.add('show');
    var signedIn = !!localStorage.getItem(SIGNED_KEY);
    var u = cachedUser();
    accountName.textContent = signedIn && u ? u.name : '';
    accountAvatar.src = signedIn && u && u.picture ? u.picture : '';
    accountAvatar.style.display = signedIn && u && u.picture ? '' : 'none';
    signOutBtn.style.display = signedIn ? '' : 'none';
    signInBtn.style.display = signedIn ? 'none' : '';
    var text = '', showReconnect = false, reconnectLabel = 'Reconnect';
    if (signedIn){
      if (syncState === 'syncing') text = syncDetail ? 'Syncing — ' + syncDetail : 'Syncing…';
      else if (syncState === 'ok') text = 'Saved to Drive ✓';
      else if (syncState === 'error'){ text = 'Sync problem'; showReconnect = true; reconnectLabel = 'Retry'; }
      else if (syncState === 'paused' || !getToken()){ text = 'Sync paused'; showReconnect = true; }
    }
    syncStatusEl.textContent = text;
    reconnectBtn.textContent = reconnectLabel;
    reconnectBtn.style.display = showReconnect ? '' : 'none';
  }

  // Sign-in uses Google's redirect flow: leave for Google, come straight back with a token in the URL.
  function redirectUri(){ return location.origin + location.pathname.replace(/index\.html$/, ''); }
  function startSignIn(){
    var state = uid() + uid();
    try { localStorage.setItem(STATE_KEY, state); } catch(e){}
    location.href = 'https://accounts.google.com/o/oauth2/v2/auth' +
      '?client_id=' + encodeURIComponent(CLIENT_ID) +
      '&redirect_uri=' + encodeURIComponent(redirectUri()) +
      '&response_type=token' +
      '&scope=' + encodeURIComponent(SCOPES) +
      '&state=' + encodeURIComponent(state) +
      '&include_granted_scopes=true';
  }
  function consumeOAuthReturn(){
    var h = location.hash || '';
    if (h.indexOf('access_token=') === -1 && h.indexOf('error=') === -1) return null;
    var params = new URLSearchParams(h.replace(/^#/, ''));
    try { history.replaceState(null, '', location.pathname + location.search); } catch(e){}
    var expect = null;
    try { expect = localStorage.getItem(STATE_KEY); localStorage.removeItem(STATE_KEY); } catch(e){}
    if (params.get('error') || !expect || params.get('state') !== expect) return { error: params.get('error') || 'state' };
    return { token: params.get('access_token'), expiresIn: parseInt(params.get('expires_in') || '3600', 10) };
  }

  // Re-draw whichever tab is showing after a sync pulled in changes (without disturbing a form being typed in)
  function refreshCurrentView(){
    var ae = document.activeElement;
    if (currentTab === 'inspo' && ae && inspoView.contains(ae) && ae.tagName === 'INPUT') return;
    showTab(currentTab);
  }

  document.getElementById('googleSignIn').addEventListener('click', function(){
    authStatus.textContent = 'Opening Google…';
    startSignIn();
  });
  reconnectBtn.addEventListener('click', function(){
    if (syncState === 'error' && getToken()) runSync(); else startSignIn();
  });
  signInBtn.addEventListener('click', startSignIn);
  document.getElementById('skipSignIn').addEventListener('click', function(){
    showAuthScreen(false);
    renderAccountBar();
    load().then(function(){ showTab('board'); });
  });
  signOutBtn.addEventListener('click', async function(){
    if (!confirm('Sign out? This clears the copy on this device. Everything stays safe in your Google Drive folder, and comes back when you sign in again.')) return;
    try { localStorage.removeItem(SIGNED_KEY); localStorage.removeItem(USER_KEY); } catch(e){}
    clearToken();
    clearTimeout(syncTimer);
    await idbClear('photos').catch(function(){});
    await idbClear('meta').catch(function(){});
    data = emptyData();
    setSyncStatus('idle');
    showAuthScreen(true);
    showTab('board');
  });

  // ---------- Start-up ----------
  if (!DRIVE_ENABLED){
    // No Google client ID configured yet — run fully on this device, same as before.
    showAuthScreen(false);
    renderAccountBar();
    load().then(function(){ showTab('board'); });
  } else {
    var ret = consumeOAuthReturn();
    if (ret && ret.token){
      storeToken(ret.token, ret.expiresIn);
      try { localStorage.setItem(SIGNED_KEY, '1'); } catch(e){}
    }
    if (ret && ret.error) authStatus.textContent = 'Sign-in didn\'t complete — please try again.';
    if (localStorage.getItem(SIGNED_KEY)){
      showAuthScreen(false);
      renderAccountBar();
      load().then(function(){
        showTab('board');
        var tk = getToken();
        if (tk){ fetchUserinfo(tk); runSync(); } else setSyncStatus('paused');
      });
    } else {
      showAuthScreen(true);
      renderAccountBar();
    }
  }
})();
</script>
</body>
</html>
